<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Finanční Dashboard</title>
<style>
body { font-family: Arial; background:#f4f4f4; margin:20px; }
.row3 { display:flex; gap:20px; margin-bottom:40px; }
.row3 iframe { flex:1; height:420px; border:1px solid #ccc; border-radius:8px; }
.block { margin-bottom:40px; }
.block iframe { width:100%; height:420px; border:1px solid #ccc; border-radius:8px; }
h2 { margin-bottom:10px; }
</style>
</head>
<body>

<h1>Finanční dashboard – živé grafy</h1>


<!-- ============================= -->
<!-- 1) TŘI GRAFY VEDLE SEBE       -->
<!-- ============================= -->

<h2>Měnové páry (vedle sebe)</h2>
<div class="row3">

  <!-- USD/CZK TradingView -->
  <!-- TradingView embed widgety umožňují timeframe 1D / 5D / 1M / 1Y / 5Y  -->
  <!-- zdroj: TradingView embed možnosti [1](https://www.tradingview.com/widget-docs/widgets/charts/) -->
  <iframe src="https://s.tradingview.com/widget/embed/?symbol=FX_IDC:USDCZK&interval=D&theme=light&style=1&hide_side_toolbar=false&allow_symbol_change=true" ></iframe>

  <!-- EUR/CZK – Investing.com advanced streaming chart -->
  <!-- Investing.com umožňuje timeframe 1D / 7D / 1M / 1Y / 5Y  -->
  <!-- zdroj: EUR/CZK streaming chart [2](https://www.investing.com/currencies/eur-czk-chart) -->
  <iframe src="https://www.investing.com/charts/live-charts?type=forex&pair_ID=32" ></iframe>

  <!-- EUR/USD – TradingView -->
  <iframe src="https://s.tradingview.com/widget/embed/?symbol=FX:EURUSD&interval=D&theme=light&style=1&hide_side_toolbar=false&allow_symbol_change=true" ></iframe>

</div>



<!-- ============================= -->
<!-- 2) DALŠÍ GRAFY POD SEBOU      -->
<!-- ============================= -->

<!-- IRS 5Y EUR  -->
<div class="block">
<h2>IRS EUR 5Y</h2>
<!-- Investing.com streaming chart pro IRS 5Y -->
<!-- zdroj: IRS 5Y streaming chart -rate-swap-streaming-chart) -->
<iframe src="https://www.investing.com/charts/live-charts?type=bonds&pair_ID=1178"></iframe>
</div>

  
<!-- TradingEconomics Crude Oil Chart -->
<div id="te-crude-oil" style="width:100%; height:450px;"></div>
<script type="text/javascript" src="https://widgets.tradingeconomics.com/chart?symbol=CRUDEOIL&width=100%&height=450&theme=light">
</script>


  
<!-- TradingEconomics Crude Oil Chart -->
<div id="te-crude-oil" style="width:100%; height:450px;"></div>
<script type="text/javascript" src="https://widgets.tradingeconomics.com/chart?symbol=CRUDEOIL&width=100%&height=450&theme=light">
</script>


<!-- BRENT OIL PRICE -->
<div class="block">
<h2>Brent Oil Price</h2>
<!-- OilPriceAPI embed -->
<!-- zdroj: Brent embed widget [3](https://www.oilpriceapi.com/widgets/oil-price-ticker) -->
<div id="oilpriceapi-ticker" data-theme="light" data-commodities="BRENT" data-layout="horizontal"></div>
<script src="https://www.oilpriceapi.com/widgets/ticker.js" async></script>
</div>


<!-- BTC/CZK -->
<div class="block">
<h2>Bitcoin (BTC/CZK)</h2>
<!-- LiveCoinWatch widget (Czech koruna base) -->
<!-- zdroj: LCW widget system [5](https://www.livecoinwatch.com/widgets) -->
<script defer src="https://www.livecoinwatch.com/static/lcw-widget.js"></script>
<div class="livecoinwatch-widget-1"
     lcw-coin="BTC"
     lcw-base="CZK"
     lcw-period="d"
     lcw-color-tx="#000000"
     lcw-color-bg="#ffffff"
     lcw-border-w="1"></div>
</div>


<!-- BTC/USD -->
<div class="block">
<h2>Bitcoin (BTC/USD)</h2>
<!-- Bitcoin.com live chart -->
<!-- zdroj: Bitcoin.com widgety [4](https://www.bitcoin.com/tools/widgets/) -->
<iframe src="https://charts.bitcoin.com/embed/widgets/live-price.html?coin=bitcoin&theme=light"
        width="100%" height="440" frameborder="0"
        style="border-radius:12px;"></iframe>
</div>


</body>
</html>
